name: .NET Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CreditAssist.Tests/CreditAssist.Tests.csproj

      - name: Run automated tests
        run: dotnet test CreditAssist.Tests/CreditAssist.Tests.csproj --configuration Release